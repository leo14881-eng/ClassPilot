# Every push: install, typecheck, run all tests, build. The server's auto-update only installs
# commits on main whose CI passed.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      # Dates must not depend on the machine's time zone (the learner is in UTC+7, the server in UTC).
      - run: TZ=America/Los_Angeles npm test
      - run: TZ=Asia/Ho_Chi_Minh npm test
